[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfill"
dynamic = ["version"]
description = "Copy data from one web application into another's form with automatic field matching. A human always presses Submit."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Harvendra Singh" }]
keywords = [
    "playwright", "form-filling", "automation", "data-entry", "rpa",
    "browser-automation", "human-in-the-loop", "interoperability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = [
    "flask>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "requests>=2.28",
    "jsonschema>=4.0",
    "ruff>=0.5",
    "build>=1.0",
]

[project.scripts]
crossfill = "crossfill.cli:main"

[project.urls]
Homepage = "https://github.com/singhharvendra/CrossFill"
Documentation = "https://github.com/singhharvendra/CrossFill/tree/main/docs"
Source = "https://github.com/singhharvendra/CrossFill/tree/main/python"
Issues = "https://github.com/singhharvendra/CrossFill/issues"
Changelog = "https://github.com/singhharvendra/CrossFill/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "crossfill.__version__" }

[tool.setuptools.packages.find]
include = ["crossfill*"]

[tool.setuptools.package-data]
crossfill = ["py.typed", "mappings/*.json", "schema/*.json", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: end-to-end tests that launch Chromium (deselect with -m 'not browser')"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S"]
ignore = [
    "S603",   # subprocess call: the web app runs our own CLI with a fixed argv
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S113"]

[tool.coverage.run]
source = ["crossfill"]

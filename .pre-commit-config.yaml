repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^spec/conformance/data/
      - id: trailing-whitespace
        exclude: ^spec/conformance/data/
  - repo: local
    hooks:
      - id: crossfill-validate
        name: validate CrossFill mappings
        entry: crossfill validate
        language: system
        files: '(spec/mappings|python/crossfill/mappings|examples/mappings)/.*\.json$'
      - id: crossfill-spec-sync
        name: copy spec/ files into the Python package
        entry: python python/sync_spec.py
        language: system
        files: '^(spec/(mappings|schema)/.*|LICENSE)$'
        pass_filenames: false

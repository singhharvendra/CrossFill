name: .NET

on:
  push:
    branches: [main]
    paths: ["dotnet/**", "spec/**", "examples/**", "python/crossfill/__init__.py", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", "spec/**", "examples/**", "python/crossfill/__init__.py", ".github/workflows/dotnet.yml"]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dotnet

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # net11.0 (latest) and net10.0 (LTS) are both built and tested.
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build (warnings are errors)
        run: dotnet build -c Release
      - name: Install Chromium
        run: dotnet src/CrossFill.Cli/bin/Release/net11.0/crossfill.dll playwright install --with-deps chromium
      - name: Validate shared and example mappings
        run: dotnet src/CrossFill.Cli/bin/Release/net11.0/crossfill.dll validate ../spec/mappings/*.json ../examples/mappings/*.json
        shell: bash
      - name: Test on .NET 11 and .NET 10 (includes the shared conformance cases)
        run: dotnet test -c Release --no-build --collect "XPlat Code Coverage"

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet pack -c Release -o ../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
